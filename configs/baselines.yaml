
answerability_rl:
  policy: Qwen/Qwen2.5-VL-3B-Instruct
  qa_data:
    generation: python -m ts_qa.gen_qa_caprl
    extraction: python -m ts_qa.extract_qa
    verification: python -m ts_qa.agent_parse
    filter: python -m ts_qa.verify_and_filter
    kept_bank: data/answerability/qa_verified_keep.jsonl
  rl_dataset:
    args: --min-qa 2 --val-size 500 --seed 0
    train: 7,243 charts / 23,436 questions
    val: 500 charts / 1,545 questions
    out_dir: out_10k_xdomain/rl
  reward_server:
    reward_pretrain: Qwen/Qwen2.5-3B-Instruct
    all_qa: true
    tp: 1
  trainer:
    num_episodes: 8
    save_steps: 25
    init_kl_coef: 0.0
    cap_prompt: null
    everything_else: same as lineuprl (RLOO, 8 samples, rollout 32 / train 128, lr 1e-6, warmup 20, gen 1024, temp 1.0, 4 GPUs)
  reported_checkpoint_step: 650
  evaluation_prompt: decodability_rl.rl.cap_prompt:TS_CAP_PROMPT

judge_rl:
  policy: Qwen/Qwen2.5-VL-3B-Instruct
  dataset: out_10k_xdomain/rl_decod
  reward_server:
    reward_pretrain: Qwen/Qwen2.5-14B-Instruct
    batch_size: 32
    max_new_tokens: 8
    reward_scale: 2.0
    selftest: true
  trainer:
    num_episodes: 2
    init_kl_coef: 0.0
    cap_prompt: decodability_rl.rl.cap_prompt:TS_CAP_PROMPT
  reported_checkpoint_step: 550

sft:
  policy: Qwen/Qwen2.5-VL-3B-Instruct
  teacher: Qwen/Qwen2.5-VL-72B-Instruct
  images_and_split: out_10k_xdomain/rl_decod/{train,val}_messages.jsonl
  prompt: decodability_rl.rl.cap_prompt:TS_CAP_PROMPT, no system message
  teacher_captions:
    temperature: 0.0
    max_tokens: 1024
    max_model_len: 4096
    tp: 4
  dataset_qc: python -m decodability_rl.sft.build_sft_dataset
  train:
    epochs: 5
    lr: 1.0e-5
    per_device_batch_size: 2
    effective_batch: 64
    max_length: 2048
    warmup_ratio: 0.05
    seed: 0
    eval_steps: 50
    save_steps: 50
    total_steps: 742
  checkpoint_selection: lowest validation loss (checkpoint-700; val loss decreases monotonically)

captioner_zoo:
  chart_input:
    max_tokens: 1024
    max_model_len: 8192
    models:
      base: Qwen/Qwen2.5-VL-3B-Instruct
      teacher72b: Qwen/Qwen2.5-VL-72B-Instruct
      qwen3vl-8b: Qwen/Qwen3-VL-8B-Instruct
      internvl3-14b: OpenGVLab/InternVL3-14B
      gemma3-12b: google/gemma-3-12b-it
      phi4mm: microsoft/Phi-4-multimodal-instruct
  digits_input:
    max_tokens: 1024
    max_model_len: 16384
    models:
      phi35-mini: microsoft/Phi-3.5-mini-instruct
      qwen25-7b: Qwen/Qwen2.5-7B-Instruct
      qwen25-14b: Qwen/Qwen2.5-14B-Instruct
      mistral-nemo-12b: mistralai/Mistral-Nemo-Instruct-2407
  series_encoder_input:
    chatts-14b: bytedance-research/ChatTS-14B
    chattime-7b: ChengsenWang/ChatTime-1-7B-Chat
